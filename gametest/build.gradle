plugins { id 'net.fabricmc.fabric-loom' }

description = '独立 GameTest 装配，验证真实目录、按卷学习和腿法书级规则。'

dependencies {
    // 26.x 不混淆：直接用官方名编译，没有映射，模组依赖也不经重映射。
    minecraft libs.minecraft
    implementation libs.fabric.loader
    implementation libs.fabric.api
    implementation project(':verification')
    implementation files(kizunaWorkspace.artifact('currency', '', false))
    implementation testFixtures('dev.kizuna.meridian.technique:fabric')
    implementation files(rootProject.project(':fabric').sourceSets.main.output.classesDirs)
    implementation('dev.kizuna.meridian.technique:fabric') { transitive = false }
    // 功法 Fabric 硬依赖 Framework 的 meridian_framework 模组；上一行只取功法模块本身，所以运行时单独装入。
    runtimeOnly 'dev.kizuna.meridian:fabric'
}

processResources {
    from(project(':fabric').sourceSets.main.resources) { exclude 'fabric.mod.json' }
    from(project(':shared').sourceSets.main.resources)
}

loom {
    mods {
        meridian_door_breaker_test { sourceSet sourceSets.main }
    }
    runs {
        gametest {
            server()
            name '千里腿数据 GameTest'
            runDir 'build/gametest'
            vmArg '-Dfabric-api.gametest'
            if (providers.gradleProperty('gametestFilter').isPresent()) {
                vmArg "-Dfabric-api.gametest.filter=${providers.gradleProperty('gametestFilter').get()}"
            }
            vmArg '-Dfabric-api.gametest.report-file=build/gametest-results.xml'
            vmArg "-DpeddlerLegwork.catalogReport=${layout.buildDirectory.file('catalog-report.txt').get().asFile}"
        }
    }
}
